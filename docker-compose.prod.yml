# Production override — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up
services:
  backend:
    build:
      context: .
      target: prod
    environment:
      RAGAAS_ENV: production
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      GCP_PROJECT_ID: ${GCP_PROJECT_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/gcp_creds
    secrets:
      - gcp_creds
    volumes:
      # No source mount in prod
      - ragaas_data:/app/local_data
    restart: always

volumes:
  ragaas_data:

secrets:
  gcp_creds:
    file: ${GOOGLE_APPLICATION_CREDENTIALS}
