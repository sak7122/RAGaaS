###############################################################################
# Deploy Demo to Firebase Hosting (keyless WIF)
#
# Manual trigger. Builds the frontend in DEMO MODE (fake in-browser backend,
# no server needed) and deploys to Firebase Hosting via Workload Identity
# Federation — no service-account JSON key (blocked by org policy).
#
# Required secrets (same as infra/app pipelines):
#   GCP_WORKLOAD_IDENTITY_PROVIDER   from terraform output wif_provider
#   GCP_SERVICE_ACCOUNT              from terraform output deployer_sa_email
#   FIREBASE_PROJECT_ID              snappy-mapper-498223-b2
#
# NOTE: WIF + the deployer SA are created by `terraform apply`. Run the infra
#       bootstrap first, then this workflow can deploy keylessly.
###############################################################################

name: Deploy Demo

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Build (demo) + deploy to Hosting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for WIF

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (DEMO mode)
        run: npm run build:demo

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # firebase-tools picks up ADC from GOOGLE_APPLICATION_CREDENTIALS
      # (set by the auth step above) — no JSON key needed.
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools@latest deploy --only hosting --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
