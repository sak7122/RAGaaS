name: Preview (PR)

# Deploys a Firebase Hosting preview channel for every PR against master.
# Preview URL appears as a comment on the PR and expires after 7 days.
# Keyless: the org blocks service-account JSON keys, so this signs in with
# Workload Identity Federation like the production pipeline does.
# Requires: GCP_WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, FIREBASE_PROJECT_ID

on:
  pull_request:
    branches: [master, main]

jobs:
  preview:
    name: Build + deploy preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # Workload Identity Federation
      pull-requests: write  # to post the preview URL comment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run backend tests (gate)
        run: pip install -r requirements.txt && python -m pytest tests/ -v --tb=short
        env:
          RAGAAS_USE_MEMORY_STORE: "1"
          RAGAAS_ENV: development

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build (preview — points at prod Cloud Run URL)
        run: npm run build
        env:
          VITE_FIREBASE_USE_EMULATOR: "false"
          VITE_API_URL:               ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_PROJECT_ID:   ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY:      ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:  ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID:       ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Deploy to Firebase Hosting preview channel
        id: channel
        run: |
          npx firebase-tools@latest hosting:channel:deploy "pr-${{ github.event.number }}" \
            --expires 7d --project "${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive --json > channel.json
          url=$(node -e 'const r=require("./channel.json").result||{};const v=Object.values(r)[0]||{};console.log(v.url||"")')
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment the preview URL on the PR
        if: steps.channel.outputs.url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.channel.outputs.url }}
        with:
          script: |
            const body = `Preview: ${process.env.PREVIEW_URL}\n\nExpires in 7 days. Commit ${context.sha.slice(0, 7)}.`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
