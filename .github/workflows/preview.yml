name: Preview (PR)

# Deploys a Firebase Hosting preview channel for every PR against master.
# Preview URL appears as a comment on the PR and expires after 7 days.
# Requires: FIREBASE_SERVICE_ACCOUNT secret (same as deploy.yml)

on:
  pull_request:
    branches: [master, main]

jobs:
  preview:
    name: Build + deploy preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # to post the preview URL comment

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Run backend tests (gate)
        run: pip install -r requirements.txt && python -m pytest tests/ -v --tb=short
        env:
          RAGAAS_USE_MEMORY_STORE: "1"
          RAGAAS_ENV: development

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build (preview — points at prod Cloud Run URL)
        run: npm run build
        env:
          VITE_FIREBASE_USE_EMULATOR: "false"
          VITE_API_URL:               ${{ secrets.VITE_API_URL }}
          VITE_FIREBASE_PROJECT_ID:   ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY:      ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:  ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID:       ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Deploy to Firebase Hosting preview channel
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:              ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId:              ${{ secrets.FIREBASE_PROJECT_ID }}
          expires:                7d
