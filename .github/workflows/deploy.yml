###############################################################################
# RAGaaS — Production Deploy
#
# Triggers: push to master (after CI passes) or manual workflow_dispatch
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#
#  GCP auth — Workload Identity Federation (keyless, no JSON key needed):
#    GCP_WORKLOAD_IDENTITY_PROVIDER  e.g. projects/123/locations/global/workloadIdentityPools/...
#    GCP_SERVICE_ACCOUNT             e.g. ragaas-deployer@genaiacademy-496218.iam.gserviceaccount.com
#
#  OR — simpler SA key fallback (less secure, avoid for prod):
#    GCP_SA_KEY                      base64-encoded service account JSON
#
#  Backend (Cloud Run env vars):
#    GCP_PROJECT_ID                  genaiacademy-496218
#    FIREBASE_PROJECT_ID             ragaas-af876
#    GCS_BUCKET                      genaiacademy-ragaas-pdfs
#    CORS_ORIGIN_REGEX               https://(ragaas-af876\.web\.app|your-domain\.com)
#
#  Frontend (Vite build-time):
#    VITE_API_URL                    https://ragaas-backend-<hash>-uc.a.run.app
#    VITE_FIREBASE_API_KEY           from Firebase console → Project settings → Web app
#    VITE_FIREBASE_AUTH_DOMAIN       ragaas-af876.firebaseapp.com
#    VITE_FIREBASE_APP_ID            1:xxx:web:xxx
#
#  Firebase Hosting deploy:
#    FIREBASE_SERVICE_ACCOUNT        service account JSON with Firebase Hosting Admin role
#                                    OR use firebase login:ci → FIREBASE_TOKEN
###############################################################################

name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── 1. Gate: backend tests must pass ─────────────────────────────────────
  test:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          RAGAAS_USE_MEMORY_STORE: "1"
          RAGAAS_ENV: development
        run: python -m pytest tests/ -v --tb=short

  # ── 2. Deploy backend → Cloud Run ────────────────────────────────────────
  deploy-backend:
    name: Deploy backend → Cloud Run
    runs-on: ubuntu-latest
    needs: test
    environment: production
    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    outputs:
      cloud_run_url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        id: deploy
        run: |
          URL=$(gcloud run deploy ragaas-backend \
            --source . \
            --region us-central1 \
            --project "${{ secrets.GCP_PROJECT_ID }}" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 10 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 60 \
            --set-env-vars "\
          RAGAAS_ENV=production,\
          GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID }},\
          FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }},\
          GCS_BUCKET=${{ secrets.GCS_BUCKET }},\
          CORS_ORIGIN_REGEX=${{ secrets.CORS_ORIGIN_REGEX }}" \
            --format "value(status.url)")
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Deployed to: $URL"

  # ── 3. Build frontend ─────────────────────────────────────────────────────
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
        env:
          VITE_FIREBASE_USE_EMULATOR: "false"
          VITE_API_URL:               ${{ needs.deploy-backend.outputs.cloud_run_url }}
          VITE_FIREBASE_PROJECT_ID:   ${{ secrets.FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_API_KEY:      ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN:  ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_APP_ID:       ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 1

  # ── 4. Deploy frontend → Firebase Hosting ────────────────────────────────
  deploy-frontend:
    name: Deploy frontend → Firebase Hosting
    runs-on: ubuntu-latest
    needs: build-frontend
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist/

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken:             ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId:             live
          projectId:             ${{ secrets.FIREBASE_PROJECT_ID }}
